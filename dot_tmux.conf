# Terminal

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Extended key support (Shift+Enter, Ctrl+Enter, etc.)
set -g extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

# Basics

unbind C-b
set-option -g prefix M-o
bind M-o send-prefix

setw -g mode-keys vi

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g status-left-length 40
set -g mouse on

# Navigation

# panes
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# windows
bind -n M-n next-window
bind -n M-p previous-window

# Splits

bind h split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

# Copy Mode

unbind [
unbind-key -T copy-mode-vi v
bind Space copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Escape send-keys -X cancel

# Theme (Catppuccin Mocha, Mauve accent)

set -g mode-style "bg=#cba6f7,fg=#1e1e2e"
set -g status-style "bg=default,fg=#cba6f7"
set -g window-status-current-style "bg=#cba6f7,fg=#1e1e2e"
